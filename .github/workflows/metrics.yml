name: Metrics
on:
  # Schedule updates (every 12 hours)
  schedule: [{cron: "0 */12 * * *"}]
  # Allow manual run
  workflow_dispatch:
  # Run on push to main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Bluewaves-afk
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          # Add these lines to fix the Achievement error
          plugin_achievements: yes
          plugin_achievements_display: detailed  # detailed looks better for top 1% profiles
          plugin_achievements_secrets: yes      # helps fetch specialized badges
          plugin_achievements_limit: 10
          # Increase timeout to prevent "Unexpected error"
          config_padding: 0, 8 + 10%
          retries: 3
          retries_delay: 300
